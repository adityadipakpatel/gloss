<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gloss settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header class="page-header">
        <h1>Gloss</h1>
        <p>Select text on any page, right-click and choose <strong>Ask Gloss</strong>.</p>
      </header>

      <section aria-labelledby="key-heading">
        <h2 id="key-heading">API key</h2>
        <label for="api-key">Anthropic API key</label>
        <div class="row">
          <input id="api-key" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
          <button id="toggle-key" type="button" class="secondary">Show</button>
          <button id="save-key" type="button">Save</button>
        </div>
        <p id="key-status" class="status" role="status"></p>
        <p class="hint">
          Stored only in this browser and sent only to api.anthropic.com. Create a key in the
          <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">Claude Console</a>.
        </p>
      </section>

      <section aria-labelledby="answers-heading">
        <h2 id="answers-heading">Answers</h2>
        <label for="model">Model</label>
        <select id="model"></select>
        <label for="length">Answer length</label>
        <select id="length">
          <option value="brief">Brief (about 50 words)</option>
          <option value="normal">Normal (about 80 words)</option>
        </select>
        <label>Keyboard shortcut</label>
        <div class="row">
          <span>Select text, then press <kbd id="shortcut">Alt+G</kbd></span>
          <button id="change-shortcut" type="button" class="secondary">Change shortcut</button>
        </div>
        <p id="settings-status" class="status" role="status"></p>
      </section>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
